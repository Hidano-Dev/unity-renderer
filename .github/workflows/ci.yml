name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          # artgraph の --diff は commit range を見るため、shallow clone では
          # PR が導入した差分が空になり gate が素通りする
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Unit and integration tests
        run: pnpm run test

      - name: Artgraph gate (pull request)
        if: github.event_name == 'pull_request'
        run: pnpm exec artgraph check --diff --base origin/${{ github.base_ref }} --gate

      - name: Artgraph gate (push)
        if: github.event_name != 'pull_request'
        run: pnpm exec artgraph check --gate

      - name: Build single-file executable
        run: pnpm run build

      - name: Smoke test executable and embedded C# templates
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # PowerShell 7.3+ は native コマンドの非ゼロ終了を ErrorActionPreference に
          # 従って終了エラーへ変換する。この smoke test は check が「失敗すること」を
          # 検証するため、その変換を無効化する (PS 5.1 では未定義だが代入は無害)
          $PSNativeCommandUseErrorActionPreference = $false
          $exe = Join-Path $env:GITHUB_WORKSPACE "dist\unity-render.exe"
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Build did not produce dist/unity-render.exe"
          }

          $smoke = Join-Path $env:RUNNER_TEMP "unity-render-smoke"
          New-Item -ItemType Directory -Force -Path $smoke | Out-Null
          Push-Location $smoke
          try {
            & $exe init render-config.json
            if ($LASTEXITCODE -ne 0 -or -not (Test-Path -LiteralPath "render-config.json")) {
              throw "The compiled executable failed the init smoke test"
            }

            # check の stderr が終了エラーとして扱われないよう、この区間だけ緩める
            $previous = $ErrorActionPreference
            $ErrorActionPreference = "Continue"
            $checkOutput = (& $exe check render-config.json 2>&1 | Out-String)
            $checkExit = $LASTEXITCODE
            $ErrorActionPreference = $previous
            Write-Host $checkOutput
            if ($checkExit -eq 0) {
              throw "check unexpectedly succeeded without a Unity installation"
            }
            if ($checkOutput -notmatch "Unity CLI|unity") {
              throw "The compiled executable did not reach the check command"
            }
          } finally {
            Pop-Location
          }

          $bytes = [System.IO.File]::ReadAllBytes($exe)
          $text = [System.Text.Encoding]::UTF8.GetString($bytes)
          if ($text -notlike "*EditorApplication.Exit(0)*") {
            throw "The compiled executable does not contain the embedded C# templates"
          }
